name: Requirements Traceability

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check requirements coverage
        run: python3 scripts/check_coverage.py

      - name: Validate SKILL.md files
        run: |
          for skill in skills/gstack/*/ skills/team/*/; do
            if [ -f "$skill/SKILL.md" ]; then
              python3 scripts/validate-skill.py "$skill" || exit 1
            fi
          done

      - name: Run all tests
        run: python3 -m pytest testing/test_validate_skill.py testing/test_doctor.py -v

      - name: Verify skill-requirements mapping
        run: |
          echo "Checking skill_requirements_mapping.yaml..."
          python3 -c "import yaml; yaml.safe_load(open('skill_requirements_mapping.yaml'))"
          echo "✓ Mapping file is valid"

      - name: Generate traceability report
        run: |
          python3 scripts/check_coverage.py > traceability_report.md
          echo "## Traceability Report" >> $GITHUB_STEP_SUMMARY
          python3 scripts/check_coverage.py >> $GITHUB_STEP_SUMMARY

  update-readme:
    runs-on: ubuntu-latest
    needs: check-coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Update README with traceability
        run: |
          python3 scripts/check_coverage.py > /tmp/traceability.md
          # Insert into README after "## Key Commands" section
          echo "" >> README.md
          echo "## Requirements Traceability" >> README.md
          echo "Last updated: $(date -u +%Y-%m-%d)" >> README.md
          cat /tmp/traceability.md >> README.md
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet --exit-code || git commit -m "docs: update traceability report" || true